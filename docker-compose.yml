name: incidentlens

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: "${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL with the encoded database password}"
  REDIS_URL: redis://redis:6379/0
  TASK_MODE: celery
  MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  MODEL_API_KEY: ${MODEL_API_KEY:-}
  MODEL_NAME: ${MODEL_NAME:-qwen-plus}
  MAX_COST_CNY: ${MAX_COST_CNY:-0.20}
  STATIC_AUTH_ENABLED: ${STATIC_AUTH_ENABLED:-true}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
  OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
  OIDC_RUNNER_GROUPS: ${OIDC_RUNNER_GROUPS:-[]}
  OIDC_ADMIN_GROUPS: ${OIDC_ADMIN_GROUPS:-[]}
  OIDC_AUTHORIZATION_URL: ${OIDC_AUTHORIZATION_URL:-}
  OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-["openid"]}
  OIDC_LOGIN_TTL_SECONDS: ${OIDC_LOGIN_TTL_SECONDS:-600}
  OIDC_LOGIN_RATE_LIMIT: ${OIDC_LOGIN_RATE_LIMIT:-10}
  OIDC_LOGIN_RATE_WINDOW_SECONDS: ${OIDC_LOGIN_RATE_WINDOW_SECONDS:-60}
  OIDC_LOGIN_MAX_OUTSTANDING: ${OIDC_LOGIN_MAX_OUTSTANDING:-5000}
  OIDC_LOGIN_MAX_OUTSTANDING_PER_CLIENT: ${OIDC_LOGIN_MAX_OUTSTANDING_PER_CLIENT:-10}
  OIDC_SESSION_TTL_SECONDS: ${OIDC_SESSION_TTL_SECONDS:-28800}
  RUNNER_TOKEN: ${RUNNER_TOKEN:-runner-demo-token}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-demo-token}
  RUNNER_CREDENTIALS:
  ADMIN_CREDENTIALS:
  CORS_ORIGINS:
  RUNNER_DAILY_LIMIT: ${RUNNER_DAILY_LIMIT:-10}
  AUTH_FAILURE_LIMIT: ${AUTH_FAILURE_LIMIT:-10}
  AUTH_FAILURE_WINDOW_SECONDS: ${AUTH_FAILURE_WINDOW_SECONDS:-300}
  RATE_LIMIT_MAX_RECORDS: ${RATE_LIMIT_MAX_RECORDS:-10000}
  RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:-incidentlens-development-rate-limit-secret}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-["172.16.0.0/12"]}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidentlens}
      POSTGRES_USER: ${POSTGRES_USER:-incidentlens}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong secret}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentlens"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "incidentlens.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *api-environment
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A incidentlens.tasks.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health/live | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  postgres-backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/incidentlens/backup-postgres.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidentlens}
      POSTGRES_USER: ${POSTGRES_USER:-incidentlens}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong secret}"
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/backup-postgres.sh:/opt/incidentlens/backup-postgres.sh:ro
      - postgres-backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/incidentlens-backup-ready"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  postgres-restore:
    image: pgvector/pgvector:pg16
    profiles: ["restore"]
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/incidentlens/restore-postgres.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidentlens}
      POSTGRES_USER: ${POSTGRES_USER:-incidentlens}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong secret}"
      BACKUP_FILE: ${BACKUP_FILE:-}
    volumes:
      - ./scripts/restore-postgres.sh:/opt/incidentlens/restore-postgres.sh:ro
      - postgres-backups:/backups:ro
    depends_on:
      postgres: { condition: service_healthy }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  tempo:
    image: grafana/tempo:2.9.0
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/tempo.yml:/etc/tempo.yml:ro

  grafana:
    image: grafana/grafana:12.3.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: incidentlens
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana-datasources.yml:/etc/grafana/provisioning/datasources/incidentlens.yml:ro
    depends_on:
      - prometheus
      - tempo

volumes:
  postgres-data:
  postgres-backups:
  redis-data:
  caddy-data:
