name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: uv sync --locked --extra dev
      - run: uv run pytest --cov=incidentlens --cov-report=term-missing
      - run: uv run ruff check .
      - run: uv run mypy services/api/incidentlens

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: "11.9.0" }
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @incidentlens/web test
      - run: pnpm --filter @incidentlens/web lint
      - run: pnpm --filter @incidentlens/web typecheck
      - run: pnpm --filter @incidentlens/web build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build and start the application stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify the public health endpoint
        run: curl --fail --retry 12 --retry-delay 2 http://127.0.0.1:3000/health/ready
      - name: Show Compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Remove test containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
