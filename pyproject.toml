[project]
name = "incidentlens"
version = "0.2.0"
description = "Evidence-first AI incident investigation assistant"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "celery>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.60,<3",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<3",
  "sse-starlette>=2.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "playwright>=1.52,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api/incidentlens"]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"services/api/incidentlens/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
